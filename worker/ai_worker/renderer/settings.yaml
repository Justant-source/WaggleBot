# ── 코덱 (RTX 3090 전용) ──
codec: h264_nvenc

# ── 품질 ──
quality:
  cq: 23
  preset: medium

# ── FPS ──
fps: 30

# ── 오디오 ──
audio:
  bitrate: 192k
  bgm_volume: 0.15
  bgm_fade_in: 1.5      # BGM 인트로 페이드인 (초)
  bgm_fade_out: 1.0     # BGM 아웃트로 페이드아웃 (초)

# ── SFX 팔레트 (이벤트 → 파일 경로, 볼륨, 오프셋) ──
sfx:
  active:
    hook_in:
      file: hook_in.wav
      volume: 0.9
      offset: 0.0       # 훅 텍스트 등장 순간
    turn:
      file: turn.wav
      volume: 0.8
      offset: 0.0       # 반전/결정적 한마디 씬 진입
    section_whoosh:
      file: section_whoosh.wav
      volume: 0.7
      offset: -0.5      # story→comment 전환 — 장면보다 살짝 먼저 끌어준다
    bubble:
      file: bubble.wav
      volume: 0.8
      offset: 0.5       # 댓글 말풍선 등장 (각 1회) — 카드가 뜨는 순간
    vote_fill:
      file: vote_fill.wav
      volume: 0.7
      offset: 0.0       # 아웃트로 투표 바 채워지는 동안
    page:
      file: page.wav
      volume: 0.30      # 화면마다 울리므로 낮게 — 있는 듯 없는 듯해야 한다
      offset: -0.08     # 화면이 바뀌는 순간보다 아주 살짝 먼저
    logo:
      file: logo.wav
      volume: 0.6
      offset: 2.6       # 투표바가 다 찬 뒤 마무리 로고
  max_per_video: 18     # 본문 화면 전환마다 page 가 붙으므로 넉넉히
  min_gap_sec: 2.5      # 연속 SFX 간격 하한 (bubble 연속 제외)
  bubble_consecutive_gap_sec: 1.0  # bubble 연속 특례

# ── 썸네일 ──
thumbnail:
  width: 1280
  height: 720
  font_size: 72
  jpeg_quality: 90

# ── V2 테마 (marketing_v2 프로필용) ──
tone_v2:
  safe_zone:
    top_pct: 0.12       # 상단 12% — 플랫폼 UI 세이프존(재생 버튼, 프로필)
    bottom_pct: 0.22    # 하단 22% — 플랫폼 UI 세이프존(좋아요, 댓글, 공유)

  typography:
    body_max_chars_per_line: 14    # 본문 줄당 최대 글자 수 (어절 단위)
    body_min_font_size_px: 56      # 본문 최소 크기
    hook_min_font_size_px: 80      # 훅 최소 크기
    wrap_word_boundary: true       # 어절 단위 줄바꿈

  comments:
    card_min_height_pct: 0.25      # 댓글 카드 최소 높이 (화면 높이 대비)

  outro:
    vote_bar:
      height: 80                   # 투표 바 높이 (px)
      corner_radius: 8             # 모서리 반경
      padding_x: 30                # 좌우 여백
      label_font_size: 32          # "A 60% : B 40%" 폰트
      pct_font_size: 28            # 백분율 숫자
      gap_top: 60                  # 투표 바 상단 여백
      color_author: "#C9785A"      # 작성자 A 색상 (피치)
      color_partner: "#5F8F76"     # 상대방 B 색상 (세이지)
